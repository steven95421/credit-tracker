name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix client
      - run: npm test
      - run: npm run build --prefix client
        env:
          # Repo → Settings → Secrets and variables → Actions → Variables:
          #   VITE_API_BASE = https://credit-tracker-api.<your-account>.workers.dev
          #   VITE_BASE     = /credit-tracker/   (or / for a custom domain)
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_BASE: ${{ vars.VITE_BASE || '/credit-tracker/' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
