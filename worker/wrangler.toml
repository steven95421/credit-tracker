# Cloudflare Worker config — the cloud API + D1 database behind the GitHub Pages UI.
# Free tier is plenty: 100k req/day, D1 5GB, cron triggers included. No card required.
name = "credit-tracker-api"
main = "src/index.js"
compatibility_date = "2026-07-01"

[observability]
enabled = true

# Daily reconciliation of Stripe, Teller, and Plaid transactions, 13:00 UTC ≈ 6am PT.
[triggers]
crons = ["0 13 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "credit-tracker"
database_id = "6e28f89a-1246-4f4f-9cff-4933b96506cd"

[vars]
# Stripe Financial Connections. The publishable key is safe to expose to the
# browser, but is installation-specific; add it here or in worker/.dev.vars:
# STRIPE_PUBLISHABLE_KEY = "pk_test_..."
STRIPE_API_VERSION = "2026-08-26.dahlia"
# Financial Connections Relink remains a public-preview API. It is isolated to
# relink requests; ordinary transaction calls continue using the stable version.
STRIPE_RELINK_API_VERSION = "2026-08-26.preview"
STRIPE_COUNTRY_CODES = "US"
APP_TIME_ZONE = "America/Los_Angeles"

# Teller: sandbox | development | production. Development/production require
# the TELLER_MTLS binding shown below.
TELLER_ENV = "sandbox"
TELLER_INITIAL_DAYS = "400"
# TELLER_APPLICATION_ID is public but installation-specific; add it after
# creating the Teller application, e.g. TELLER_APPLICATION_ID = "app_..."

# Plaid: sandbox | production
PLAID_ENV = "sandbox"
PLAID_COUNTRY_CODES = "US"
PLAID_PRODUCTS = "transactions"
# Comma-separated browser origins allowed to call this API (no trailing slash):
#   your GitHub Pages origin + local dev.
ALLOWED_ORIGINS = "https://steven95421.github.io,http://localhost:5173"
# ALLOWED_EMAIL (who may log in) is a wrangler secret — set via:
#   npx wrangler secret put ALLOWED_EMAIL
# (kept out of this file so the public repo doesn't expose the address)
# OAuth 2.0 Web client ID from Google Cloud console (client IDs are public by design):
GOOGLE_CLIENT_ID = "937221315014-eo5i7t9ard82tnvblk7sklfq8j5u1rl8.apps.googleusercontent.com"
# Session lifetime in days:
SESSION_TTL_DAYS = "30"
# Uncomment once registered in the Plaid dashboard (needed for OAuth banks like Amex/Citi/Chase):
# PLAID_REDIRECT_URI = "https://REPLACE_GITHUB_USERNAME.github.io/credit-tracker/"

# Teller development/production outbound mTLS binding. Upload the Teller-issued
# cert/key with Wrangler, then uncomment and paste the returned certificate id:
# [[mtls_certificates]]
# binding = "TELLER_MTLS"
# certificate_id = "REPLACE_WITH_CLOUDFLARE_CERTIFICATE_ID"

# Secrets — set these with `npx wrangler secret put <NAME>`, never in this file:
#   STRIPE_SECRET_KEY       (sk_test_... while testing; use sk_live_... only after registration)
#   STRIPE_WEBHOOK_SECRET   (whsec_... for POST /api/webhooks/stripe)
#   ADDITIONAL_ALLOWED_EMAILS (optional comma-separated extra Google accounts)
#   TELLER_TOKEN_SIGNING_KEY  (public Token Signing Key from Teller dashboard)
#   TOKEN_ENCRYPTION_KEY      (long random secret used to encrypt access tokens in D1)
#   PLAID_CLIENT_ID   (from dashboard.plaid.com/developers/keys)
#   PLAID_SECRET      (same page; use the secret matching PLAID_ENV)
#   SESSION_SECRET    (any long random string, e.g. `openssl rand -hex 32`)
